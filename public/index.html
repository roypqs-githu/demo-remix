<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Remix Pro DJ DEMO</title>

<style>
body {
    background: #020617;
    color: white;
    font-family: Arial;
    margin: 0;
}

/* HEADER */
header {
    padding: 12px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    border-bottom: 1px solid #1e293b;
}

/* NAV */
.nav {
    padding: 10px;
}

button {
    padding: 10px 14px;
    margin-right: 5px;
    background: #1e293b;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 14px;
}

/* PATH */
#path {
    padding: 8px 12px;
    font-size: 12px;
    color: #94a3b8;
    overflow-x: auto;
    white-space: nowrap;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 10px;
}

@media (min-width: 600px) {
    .grid {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (min-width: 900px) {
    .grid {
        grid-template-columns: repeat(5, 1fr);
    }
}

/* CARD */
.card {
    background: #0f172a;
    padding: 15px 10px;
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
}

.card:hover {
    background: #1e293b;
}

.icon {
    font-size: 40px;
    margin-bottom: 10px;
}

.card div:last-child {
    font-size: 13px;
    word-break: break-word;
}

/* PLAYER */
.player-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #020617;
    border-top: 1px solid #1e293b;
    padding: 8px;
}

/* AUDIO */
audio {
    width: 100%;
}

/* VIDEO */
video {
    width: 100%;
    max-height: 250px;
    background: black;
}

/* espacio para player */
body::after {
    content: "";
    display: block;
    height: 90px;
}
</style>

</head>

<body>

<header>🎧 Remix Pro DJ DEMO</header>

<div class="nav">
    <button onclick="goBack()">⬅</button>
    <button onclick="goHome()">🏠</button>
</div>

<div id="path"></div>

<div id="explorer" class="grid">Cargando...</div>

<!-- PLAYER 🔥 -->
<div class="player-bar">

    <audio id="audioPlayer" controls controlsList="nodownload" style="display:none;"></audio>

    <video id="videoPlayer" controls playsinline webkit-playsinline style="display:none;"></video>

</div>

<script>

let ROOT = null;
let historyStack = [];

// detectar carpeta base
async function detectRoot() {

    const res = await fetch("/list?path=/");
    const text = await res.text();

    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "text/xml");

    const items = xml.getElementsByTagName("d:response");

    for (let i = 0; i < items.length; i++) {

        const href = items[i].getElementsByTagName("d:href")[0].textContent;
        const decoded = decodeURIComponent(href).toLowerCase();

        if (decoded.includes("remix pro dj")) {
            ROOT = href;
            loadFolder(ROOT);
            return;
        }
    }
}

// cargar carpeta
async function loadFolder(path, addToHistory = true) {

    if (addToHistory) historyStack.push(path);

    document.getElementById("path").innerText =
        decodeURIComponent(path);

    const res = await fetch("/list?path=" + encodeURIComponent(path));
    const text = await res.text();

    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "text/xml");

    const items = xml.getElementsByTagName("d:response");

    let html = "";

    for (let i = 0; i < items.length; i++) {

        const href = items[i].getElementsByTagName("d:href")[0].textContent;

        if (href === path) continue;

        const decoded = decodeURIComponent(href);
        const parts = decoded.split("/").filter(Boolean);
        const name = parts[parts.length - 1];

        if (!name || name.startsWith(".")) continue;

        if (href.endsWith("/")) {
            html += `
            <div class="card" onclick="loadFolder('${href}')">
                <div class="icon">📁</div>
                <div>${name}</div>
            </div>`;
        } else {
            html += `
            <div class="card" onclick="playFile('${href}')">
                <div class="icon">🎵</div>
                <div>${name}</div>
            </div>`;
        }
    }

    document.getElementById("explorer").innerHTML =
        html || "Carpeta vacía";
}

// 🔥 REPRODUCCIÓN INTELIGENTE
function playFile(url) {

    const fullUrl = "/stream?url=https://webdav.opendrive.com" + encodeURIComponent(url);

    const audio = document.getElementById("audioPlayer");
    const video = document.getElementById("videoPlayer");

    audio.pause();
    video.pause();

    audio.style.display = "none";
    video.style.display = "none";

    const lower = url.toLowerCase();

    if (
        lower.endsWith(".mp4") ||
        lower.endsWith(".mkv") ||
        lower.endsWith(".webm")
    ) {
        video.src = fullUrl;
        video.style.display = "block";
        video.play();
    } else {
        audio.src = fullUrl;
        audio.style.display = "block";
        audio.play();
    }
}

// regresar
function goBack() {
    if (historyStack.length > 1) {
        historyStack.pop();
        const prev = historyStack.pop();
        loadFolder(prev);
    }
}

// inicio
function goHome() {
    historyStack = [];
    if (ROOT) loadFolder(ROOT);
}

// iniciar
detectRoot();

</script>

</body>
</html>
