<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Remix Pro DJ DEMO</title>

<style>
body {
    background: #0f172a;
    color: white;
    font-family: Arial;
    margin: 0;
}

header {
    padding: 15px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    background: #020617;
}

.nav {
    padding: 10px;
    background: #020617;
}

button {
    padding: 8px 12px;
    margin-right: 5px;
    background: #1e293b;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 5px;
}

button:hover {
    background: #334155;
}

.item {
    padding: 10px;
    border-bottom: 1px solid #1e293b;
    cursor: pointer;
}

.item:hover {
    background: #1e293b;
}

audio {
    width: 100%;
    margin-top: 10px;
}
</style>
</head>

<body>

<header>🎧 Remix Pro DJ DEMO</header>

<div class="nav">
    <button onclick="goBack()">⬅ Regresar</button>
    <button onclick="goHome()">🏠 Inicio</button>
</div>

<div id="explorer"></div>

<audio id="player" controls controlsList="nodownload"></audio>

<script>

// 🔥 SOLO ESTA CARPETA (RAÍZ REAL)
const ROOT = "/Remix Pro DJ/";

let historyStack = [];

async function loadFolder(path = ROOT, addToHistory = true) {

    if (addToHistory) {
        historyStack.push(path);
    }

    const res = await fetch("/list?path=" + path);
    const text = await res.text();

    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "text/xml");

    const items = xml.getElementsByTagName("d:response");

    let html = "";

    for (let i = 0; i < items.length; i++) {

        const href = items[i].getElementsByTagName("d:href")[0].textContent;
        const cleanHref = decodeURIComponent(href);

        // ❌ evitar que aparezca la carpeta base
        if (cleanHref === path || cleanHref === path + "/") continue;

        const name = cleanHref.split("/").filter(Boolean).pop();

        if (!name) continue;

        // ❌ ocultar archivos raros
        if (name.startsWith(".")) continue;

        if (cleanHref.endsWith("/")) {
            html += `<div class="item" onclick="loadFolder('${cleanHref}')">📁 ${name}</div>`;
        } else {
            html += `<div class="item" onclick="playFile('${cleanHref}')">🎵 ${name}</div>`;
        }
    }

    document.getElementById("explorer").innerHTML = html;
}

// ▶ reproducir
function playFile(url) {
    document.getElementById("player").src =
        "/stream?url=https://webdav.opendrive.com" + url;
}

// 🔙 regresar
function goBack() {
    if (historyStack.length > 1) {
        historyStack.pop();
        const prev = historyStack.pop();
        loadFolder(prev);
    }
}

// 🏠 inicio
function goHome() {
    historyStack = [];
    loadFolder(ROOT);
}

// iniciar
loadFolder(ROOT);

</script>

</body>
</html>
