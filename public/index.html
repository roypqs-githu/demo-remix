<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Remix Pro DJ DEMO</title>

<style>
body {
    background: #020617;
    color: white;
    font-family: Arial;
    margin: 0;
}

/* HEADER */
header {
    padding: 15px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    background: #020617;
    border-bottom: 1px solid #1e293b;
}

/* NAV */
.nav {
    padding: 10px;
    background: #020617;
    border-bottom: 1px solid #1e293b;
}

button {
    padding: 8px 12px;
    margin-right: 5px;
    background: #1e293b;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 5px;
}

button:hover {
    background: #334155;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 15px;
    padding: 15px;
}

/* CARDS */
.card {
    background: #0f172a;
    padding: 15px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
    text-align: center;
}

.card:hover {
    background: #1e293b;
}

.icon {
    font-size: 30px;
    margin-bottom: 10px;
}

/* PLAYER */
.player-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #020617;
    border-top: 1px solid #1e293b;
    padding: 10px;
}

audio {
    width: 100%;
}
</style>

</head>

<body>

<header>🎧 Remix Pro DJ DEMO</header>

<div class="nav">
    <button onclick="goBack()">⬅ Regresar</button>
    <button onclick="goHome()">🏠 Inicio</button>
</div>

<div id="path" style="padding:10px; color:#94a3b8;"></div>

<div id="explorer" class="grid">Cargando...</div>

<div class="player-bar">
    <audio id="player" controls controlsList="nodownload"></audio>
</div>

<script>

let ROOT = null;
let historyStack = [];

// 🔥 detectar carpeta base
async function detectRoot() {

    const res = await fetch("/list?path=/");
    const text = await res.text();

    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "text/xml");

    const items = xml.getElementsByTagName("d:response");

    for (let i = 0; i < items.length; i++) {

        const href = items[i].getElementsByTagName("d:href")[0].textContent;
        const decoded = decodeURIComponent(href).toLowerCase();

        if (decoded.includes("remix pro dj")) {
            ROOT = href;
            loadFolder(ROOT);
            return;
        }
    }

    document.getElementById("explorer").innerHTML =
        "❌ No se encontró la carpeta Remix Pro DJ";
}

// 📁 cargar carpeta
async function loadFolder(path, addToHistory = true) {

    if (addToHistory) {
        historyStack.push(path);
    }

    document.getElementById("path").innerText =
        decodeURIComponent(path);

    const res = await fetch("/list?path=" + encodeURIComponent(path));
    const text = await res.text();

    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "text/xml");

    const items = xml.getElementsByTagName("d:response");

    let html = "";

    for (let i = 0; i < items.length; i++) {

        const href = items[i].getElementsByTagName("d:href")[0].textContent;

        if (href === path) continue;

        const decoded = decodeURIComponent(href);
        const parts = decoded.split("/").filter(Boolean);
        const name = parts[parts.length - 1];

        if (!name) continue;
        if (name.startsWith(".")) continue;

        if (href.endsWith("/")) {
            html += `
            <div class="card" onclick="loadFolder('${href}')">
                <div class="icon">📁</div>
                <div>${name}</div>
            </div>`;
        } else {
            html += `
            <div class="card" onclick="playFile('${href}')">
                <div class="icon">🎵</div>
                <div>${name}</div>
            </div>`;
        }
    }

    document.getElementById("explorer").innerHTML =
        html || "⚠️ Carpeta vacía";
}

// ▶ reproducir
function playFile(url) {
    document.getElementById("player").src =
        "/stream?url=https://webdav.opendrive.com" + encodeURIComponent(url);
}

// 🔙 regresar
function goBack() {
    if (historyStack.length > 1) {
        historyStack.pop();
        const prev = historyStack.pop();
        loadFolder(prev);
    }
}

// 🏠 inicio
function goHome() {
    historyStack = [];
    if (ROOT) loadFolder(ROOT);
}

// iniciar
detectRoot();

</script>

</body>
</html>
