<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Remix Pro DJ DEMO</title>

<style>
body {
    background: #020617;
    color: white;
    font-family: Arial;
    margin: 0;
}

header {
    padding: 12px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    border-bottom: 1px solid #1e293b;
}

.nav {
    padding: 10px;
}

button {
    padding: 10px;
    background: #1e293b;
    color: white;
    border: none;
    border-radius: 6px;
}

#path {
    padding: 8px;
    font-size: 12px;
    color: #94a3b8;
    overflow-x: auto;
    white-space: nowrap;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 10px;
}

.card {
    background: #0f172a;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
}

.icon {
    font-size: 40px;
}

.player-bar {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #020617;
    padding: 8px;
}

audio, video {
    width: 100%;
}
</style>
</head>

<body>

<header>🎧 Remix Pro DJ DEMO</header>

<div class="nav">
    <button onclick="goBack()">⬅</button>
    <button onclick="goHome()">🏠</button>
</div>

<div id="path"></div>

<div id="explorer" class="grid"></div>

<div class="player-bar">

<audio id="audioPlayer" controls controlsList="nodownload"></audio>

<video id="videoPlayer"
controls
controlsList="nodownload nofullscreen"
playsinline webkit-playsinline
style="display:none;">
</video>

</div>

<script>

let ROOT = null;
let historyStack = [];

async function detectRoot() {

    const res = await fetch("/list?path=/");
    const text = await res.text();

    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "text/xml");

    const items = xml.getElementsByTagName("d:response");

    for (let i = 0; i < items.length; i++) {

        const href = items[i].getElementsByTagName("d:href")[0].textContent;

        if (decodeURIComponent(href).toLowerCase().includes("remix pro dj")) {
            ROOT = href;
            loadFolder(ROOT);
            return;
        }
    }
}

async function loadFolder(path, addToHistory = true) {

    if (addToHistory) historyStack.push(path);

    document.getElementById("path").innerText = decodeURIComponent(path);

    const res = await fetch("/list?path=" + encodeURIComponent(path));
    const text = await res.text();

    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "text/xml");

    const items = xml.getElementsByTagName("d:response");

    let html = "";

    for (let i = 0; i < items.length; i++) {

        const href = items[i].getElementsByTagName("d:href")[0].textContent;

        if (href === path) continue;

        const name = decodeURIComponent(href.split("/").pop());

        if (!name) continue;

        if (href.endsWith("/")) {

            html += `<div class="card" onclick="loadFolder('${href}')">
            <div class="icon">📁</div>${name}</div>`;

        } else {

            html += `<div class="card" onclick="playFile('${href}')">
            <div class="icon">🎵</div>${name}</div>`;
        }
    }

    document.getElementById("explorer").innerHTML = html;
}

function playFile(url) {

    const fullUrl = "/stream?url=https://webdav.opendrive.com" + encodeURIComponent(url);

    const audio = document.getElementById("audioPlayer");
    const video = document.getElementById("videoPlayer");

    audio.pause();
    video.pause();

    audio.style.display = "none";
    video.style.display = "none";

    const lower = url.toLowerCase();

    if (lower.endsWith(".mp4")) {

        video.src = fullUrl;
        video.style.display = "block";
        video.play();

    } else if (lower.endsWith(".mp3")) {

        audio.src = fullUrl;
        audio.style.display = "block";
        audio.play();

    } else if (lower.endsWith(".flac")) {

        alert("⚠️ FLAC no es compatible en iPhone. Usa MP3.");

    }
}

function goBack() {
    if (historyStack.length > 1) {
        historyStack.pop();
        loadFolder(historyStack.pop());
    }
}

function goHome() {
    historyStack = [];
    loadFolder(ROOT);
}

detectRoot();

</script>

</body>
</html>
