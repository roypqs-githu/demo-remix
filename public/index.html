<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Remix Pro DJ DEMO</title>

<style>
body {
    background: #020617;
    color: white;
    font-family: Arial;
    margin: 0;
}

/* HEADER */
header {
    padding: 15px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    border-bottom: 1px solid #1e293b;
}

/* NAV */
.nav {
    padding: 10px;
    border-bottom: 1px solid #1e293b;
}

button {
    padding: 8px 12px;
    margin-right: 5px;
    background: #1e293b;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 5px;
}

button:hover {
    background: #334155;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 15px;
    padding: 15px;
}

/* CARDS */
.card {
    background: #0f172a;
    padding: 15px;
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
}

.card:hover {
    background: #1e293b;
}

.icon {
    font-size: 30px;
    margin-bottom: 10px;
}

/* PLAYER */
.player-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #020617;
    border-top: 1px solid #1e293b;
    padding: 10px;
}

audio, video {
    width: 100%;
}

/* evitar que se tape contenido */
body::after {
    content: "";
    display: block;
    height: 100px;
}
</style>

</head>

<body>

<header>🎧 Remix Pro DJ DEMO</header>

<div class="nav">
    <button onclick="goBack()">⬅ Regresar</button>
    <button onclick="goHome()">🏠 Inicio</button>
</div>

<div id="path" style="padding:10px; color:#94a3b8;"></div>

<div id="explorer" class="grid">Cargando...</div>

<div class="player-bar">

    <!-- AUDIO -->
    <audio id="audioPlayer" controls controlsList="nodownload"></audio>

    <!-- VIDEO -->
    <video id="videoPlayer"
        controls
        controlsList="nodownload nofullscreen"
        playsinline webkit-playsinline
        style="display:none; max-height:250px; background:black;">
    </video>

</div>

<script>

let ROOT = null;
let historyStack = [];

// detectar carpeta base (tu versión original)
async function detectRoot() {

    const res = await fetch("/list?path=/");
    const text = await res.text();

    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "text/xml");

    const items = xml.getElementsByTagName("d:response");

    for (let i = 0; i < items.length; i++) {

        const href = items[i].getElementsByTagName("d:href")[0].textContent;
        const decoded = decodeURIComponent(href).toLowerCase();

        if (decoded.includes("remix pro dj")) {
            ROOT = href;
            loadFolder(ROOT);
            return;
        }
    }

    document.getElementById("explorer").innerHTML =
        "❌ No se encontró la carpeta Remix Pro DJ";
}

// cargar carpeta (SIN CAMBIOS)
async function loadFolder(path, addToHistory = true) {

    if (addToHistory) {
        historyStack.push(path);
    }

    document.getElementById("path").innerText =
        decodeURIComponent(path);

    const res = await fetch("/list?path=" + encodeURIComponent(path));
    const text = await res.text();

    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "text/xml");

    const items = xml.getElementsByTagName("d:response");

    let html = "";

    for (let i = 0; i < items.length; i++) {

        const href = items[i].getElementsByTagName("d:href")[0].textContent;

        if (href === path) continue;

        const decoded = decodeURIComponent(href);
        const parts = decoded.split("/").filter(Boolean);
        const name = parts[parts.length - 1];

        if (!name || name.startsWith(".")) continue;

        if (href.endsWith("/")) {
            html += `
            <div class="card" onclick="loadFolder('${href}')">
                <div class="icon">📁</div>
                <div>${name}</div>
            </div>`;
        } else {
            html += `
            <div class="card" onclick="playFile('${href}')">
                <div class="icon">🎵</div>
                <div>${name}</div>
            </div>`;
        }
    }

    document.getElementById("explorer").innerHTML =
        html || "⚠️ Carpeta vacía";
}

// 🔥 REPRODUCCIÓN MEJORADA
function playFile(url) {

    const fullUrl = "/stream?url=https://webdav.opendrive.com" + encodeURIComponent(url);

    const audio = document.getElementById("audioPlayer");
    const video = document.getElementById("videoPlayer");

    audio.pause();
    video.pause();

    audio.style.display = "none";
    video.style.display = "none";

    const lower = url.toLowerCase();

    if (lower.endsWith(".mp4")) {

        video.src = fullUrl;
        video.style.display = "block";
        video.load();
        video.play();

    } else if (lower.endsWith(".mp3")) {

        audio.src = fullUrl;
        audio.style.display = "block";
        audio.load();
        audio.play();

    } else if (lower.endsWith(".flac")) {

        alert("⚠️ FLAC no compatible en navegador (iPhone).");

    }
}

// navegación (igual)
function goBack() {
    if (historyStack.length > 1) {
        historyStack.pop();
        const prev = historyStack.pop();
        loadFolder(prev);
    }
}

function goHome() {
    historyStack = [];
    if (ROOT) loadFolder(ROOT);
}

// iniciar
detectRoot();

</script>

</body>
</html>
