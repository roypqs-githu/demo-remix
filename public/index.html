<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Remix Pro DJ DEMO</title>

<style>
body {
    background: #0f172a;
    color: white;
    font-family: Arial;
}

header {
    padding: 15px;
    text-align: center;
    font-size: 22px;
}

.item {
    padding: 10px;
    border-bottom: 1px solid #1e293b;
    cursor: pointer;
}

.item:hover {
    background: #1e293b;
}
</style>
</head>

<body>

<header>🎧 Remix Pro DJ DEMO</header>

<div id="explorer"></div>

<audio id="player" controls style="width:100%; margin-top:20px;"></audio>

<script>
async function loadFolder(path = "/") {

    const res = await fetch("/list?path=" + path);
    const text = await res.text();

    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "text/xml");

    const items = xml.getElementsByTagName("d:response");

    let html = "";

    for (let i = 0; i < items.length; i++) {

        const href = items[i].getElementsByTagName("d:href")[0].textContent;

        if (href === path) continue;

        const name = decodeURIComponent(href.split("/").filter(Boolean).pop());

        if (!name) continue;

        if (href.endsWith("/")) {
            html += `<div class="item" onclick="loadFolder('${href}')">📁 ${name}</div>`;
        } else {
            html += `<div class="item" onclick="playFile('${href}')">🎵 ${name}</div>`;
        }
    }

    document.getElementById("explorer").innerHTML = html;
}

function playFile(url) {
    document.getElementById("player").src = "/stream?url=https://webdav.opendrive.com" + url;
}

loadFolder();
</script>

</body>
</html>
